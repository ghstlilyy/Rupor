name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: ./build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rupor-unsigned-ipa
          path: Rupor.ipa
