name: Rupor
options:
  bundleIdPrefix: com.ghostlilyy
  deploymentTarget:
    iOS: "17.0"
targets:
  Rupor:
    type: application
    platform: iOS
    sources: [Rupor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostlilyy.rupor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rupor
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Rupor записывает ваш голос, чтобы сразу проиграть его с эффектами."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
